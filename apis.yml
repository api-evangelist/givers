name: Givers
description: 'Givers is a healthcare technology platform that enrolls, supports, and pays family
  caregivers through state programs. Qualified family caregivers can earn up to $2,000 per month tax-free
  while caring for a loved one such as a parent, spouse, or child. Givers handles Medicaid and state
  program eligibility screening and enrollment, provides caregiver coaching and training, and manages
  ongoing payment processing on behalf of the caregiver. The company operates a consumer web platform
  rather than a public developer API. It is backed by CRV and profiled in the API Evangelist network.'
